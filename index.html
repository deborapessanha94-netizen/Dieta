<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AllFit - Versão GitHub</title>
<style>
body{font-family:Arial;background:#111;color:#fff;margin:0}
.container{padding:20px;max-width:500px;margin:auto}
input,button{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none}
button{background:#f72585;color:#fff;cursor:pointer}
.card{background:#1c1c1c;padding:15px;border-radius:12px;margin-bottom:10px}
</style>
</head>
<body>

<div id="auth" class="container">
  <h2>AllFit</h2>

  <div id="login">
    <input id="loginEmail" placeholder="Email">
    <input id="loginPass" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
  </div>

  <div id="register">
    <input id="regName" placeholder="Nome">
    <input id="regEmail" placeholder="Email">
    <input id="regPass" type="password" placeholder="Senha">
    <button onclick="register()">Criar conta</button>
  </div>
</div>

<div id="app" class="container" style="display:none">

  <div class="card">
    <h3>Refeições (editar horários)</h3>

    <label>Café da manhã</label>
    <input type="time" onchange="updateMeal('cafe', this.value)">

    <label>Almoço</label>
    <input type="time" onchange="updateMeal('almoco', this.value)">

    <label>Jantar</label>
    <input type="time" onchange="updateMeal('jantar', this.value)">
  </div>

  <div class="card">
    <h3>Upload de Treino</h3>
    <input type="file" id="fileTreino">
    <button onclick="uploadTreino()">Importar treino</button>
  </div>

  <div class="card">
    <h3>Dieta gerada</h3>
    <p id="dieta"></p>
  </div>

</div>

<script>

function register(){
  const user = {
    name: regName.value,
    email: regEmail.value,
    pass: regPass.value
  }
  localStorage.setItem('user', JSON.stringify(user));
  alert('Conta criada!');
}

function login(){
  const user = JSON.parse(localStorage.getItem('user'));

  if(user && user.email === loginEmail.value && user.pass === loginPass.value){
    auth.style.display = 'none';
    app.style.display = 'block';
  }else{
    alert('Login inválido');
  }
}

function updateMeal(tipo, horario){
  let data = JSON.parse(localStorage.getItem('data') || '{}');
  if(!data.meals) data.meals = {};

  data.meals[tipo] = horario;

  localStorage.setItem('data', JSON.stringify(data));
}

function uploadTreino(){
  const file = document.getElementById('fileTreino').files[0];

  if(!file) return alert('Selecione um arquivo');

  const reader = new FileReader();

  reader.onload = function(e){
    let treino;

    try{
      treino = JSON.parse(e.target.result);
    }catch{
      treino = e.target.result.split('\n');
    }

    let data = JSON.parse(localStorage.getItem('data') || '{}');
    data.treino = treino;

    localStorage.setItem('data', JSON.stringify(data));

    gerarDieta();
  }

  reader.readAsText(file);
}

function gerarDieta(){
  let data = JSON.parse(localStorage.getItem('data') || '{}');

  if(!data.treino) return;

  let intensidade = data.treino.length;

  let dieta;

  if(intensidade > 5){
    dieta = 'Alta intensidade: 2000 kcal | 140g proteína';
  }else{
    dieta = 'Baixa intensidade: 1500 kcal | 110g proteína';
  }

  document.getElementById('dieta').innerText = dieta;
}

</script>

</body>
</html>
